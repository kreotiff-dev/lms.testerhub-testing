name: "🐛 Bug Report"
description: Сообщить о баге в LMS
title: "[BUG] кратко: что не так"
labels: ["bug", "bug:testerhub"]
projects:
  - kreotiff-dev/lms.testerhub-testing # проект по умолчанию

body:
  # Testing Lab поля (требуются для начисления очков)
  - type: input
    id: pid
    attributes:
      label: PID (Participant ID)
      description: Ваш ID участника Testing Lab (вставляется автоматически)
      placeholder: "pid_abc123..."
    validations:
      required: false

  - type: input
    id: checklist_id
    attributes:
      label: Checklist ID
      description: ID чек-листа, на котором найден баг
      placeholder: "2025-10-28-profile-management"
    validations:
      required: false

  - type: input
    id: item_id
    attributes:
      label: Item ID
      description: ID пункта чек-листа (например, item_0, item_5 или 'general')
      placeholder: "item_0 или general"
    validations:
      required: false

  # Основная информация о баге
  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      description: Насколько критична проблема?
      options:
        - "P0 — 🔴 Полный блокер (невозможно работать, нет обходного пути)"
        - "P1 — 🟠 Критично (мешает основному сценарию, обход есть)"
        - "P2 — 🟢 Средне (вторичный сценарий, обход возможен)"
        - "P3 — ⚪️ Низко (косметика/улучшение)"
    validations:
      required: true

  - type: input
    id: preconditions
    attributes:
      label: Предусловия
      description: Что должно быть выполнено до начала воспроизведения (окружение, данные, авторизация и т.п.)
      placeholder: |
        Пользователь авторизован в LMS
        Есть курс "Postman"
        Используется Chrome/Windows 11

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1) ...
        2) ...
        3) ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: false

  - type: textarea
    id: artifacts
    attributes:
      label: Артефакты (скрин/видео/лог)
      description: "Прикрепи файлы или ссылки (Drive, Loom и т.п.)"
