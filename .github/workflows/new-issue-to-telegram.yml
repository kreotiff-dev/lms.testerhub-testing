name: Новый issue → Telegram бот

on:
  issues:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Отправить уведомление в чат с ботом
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          disable_web_page_preview: false
          message: |
            <b>🆕 Новый баг/таск в LMS</b>

            <b>#${{ github.event.issue.number }}</b> — <i>${{ github.event.issue.title }}</i>

            👤 Автор: @${{ github.event.issue.user.login }}
            🔗 <a href="${{ github.event.issue.html_url }}">Открыть issue</a>

            <pre>${{ github.event.issue.body || 'Описание отсутствует' }}</pre>

            <i>Создано: ${{ github.event.issue.created_at }}</i>
